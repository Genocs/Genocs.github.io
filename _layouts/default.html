<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | truncate: 160 }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/custom.css?v=' | append: site.github.build_revision | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#content">skip to content</a>

    <header class="site-header">
      <div class="site-header-inner">
        <a class="site-brand" href="{{ '/' | relative_url }}">
          <span class="site-mark">*</span>
          <span class="site-name">{{ site.title }}</span>
        </a>
        <nav class="site-nav" aria-label="Primary">
          <a href="{{ '/' | relative_url }}">index</a>
          <a href="{{ '/#notes' | relative_url }}">notes</a>
          {% if site.github.owner_url %}
            <a href="{{ site.github.owner_url }}">github</a>
          {% else %}
            <a href="https://github.com/{{ site.github_username }}">github</a>
          {% endif %}
        </nav>
      </div>
      <p class="site-tagline">{{ site.description }}</p>
    </header>

    <main id="content" class="site-main">
      {{ content }}
    </main>

    <footer class="site-footer">
      <p>{{ site.author }}</p>
      <p><a href="mailto:{{ site.email }}">{{ site.email }}</a></p>
      <p class="site-footer-meta">idea → product · dry · kiss</p>
    </footer>
  </body>
</html>
